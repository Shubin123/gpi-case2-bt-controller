# DualShock 4 emulation needs bluetoothd to:
#   -P input  leave L2CAP PSM 17/19 (HID) to bt_gamepad.py
#   -C        expose the legacy SDP socket so sdptool works (bt-ssh SPP record)
#   -f        use our main.conf (Name, Class 0x000508, DeviceID usb:054C:09CC)
# Set here rather than in /storage/.cache/services/bluez.conf, which Lakka rewrites.
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd -C -P input -f /storage/.config/bluetooth/main.conf $BLUEZ_DEBUG
